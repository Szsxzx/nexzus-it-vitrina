# ─── Render.com — INCODOL Backend (FastAPI) ───────────────────────────────────
# Sube este archivo a Bitbucket y conecta el repo en render.com

services:
  - type: web
    name: incodol-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render genera uno automáticamente
      - key: DATABASE_URL
        value: sqlite:///./incodol.db   # Cambiar por PostgreSQL en producción
      - key: ALLOWED_ORIGINS
        value: https://TU-SITIO.netlify.app
