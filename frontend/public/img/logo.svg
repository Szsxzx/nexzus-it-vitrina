<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" role="img" aria-label="Carnicería Fuente de Vida">
  <!-- Líneas decorativas laterales -->
  <line x1="10" y1="22" x2="68" y2="22" stroke="#8B0000" stroke-width="0.8" opacity="0.7"/>
  <line x1="212" y1="22" x2="270" y2="22" stroke="#8B0000" stroke-width="0.8" opacity="0.7"/>

  <!-- · CARNICERÍA · -->
  <text
    x="140" y="27"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="9"
    letter-spacing="4"
    text-anchor="middle"
    fill="#8B0000"
    font-weight="400"
  >· CARNICERÍA ·</text>

  <!-- Fuente de Vida -->
  <text
    x="140" y="62"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    letter-spacing="1"
    text-anchor="middle"
    fill="#1a1a1a"
    font-weight="700"
    font-style="italic"
  >Fuente de Vida</text>

  <!-- Línea inferior decorativa -->
  <line x1="80" y1="74" x2="200" y2="74" stroke="#8B0000" stroke-width="0.6" opacity="0.5"/>
</svg>
