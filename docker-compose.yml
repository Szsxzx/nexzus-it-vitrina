# =========================================================================
#  Vitrina — Carnicería Fuente de Vida
#
#  Levantar:    docker compose up --build
#  Reset BD:    docker compose down -v && docker compose up --build
#  Migrar BD:   docker compose exec backend alembic upgrade head
# =========================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - vitrina-net
    environment:
      POSTGRES_USER: vitrina
      POSTGRES_PASSWORD: vitrina
      POSTGRES_DB: vitrina
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata_vitrina:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrina -d vitrina"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - vitrina-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://vitrina:vitrina@db:5432/vitrina
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-openssl-rand-hex-32}
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      FIRST_ADMIN_EMAIL: admin@fuentedevida.co
      FIRST_ADMIN_USERNAME: admin
      FIRST_ADMIN_PASSWORD: Admin123!
      # Los bind mounts de Docker Desktop en Windows no propagan bien los
      # eventos nativos de filesystem: sin esto, --reload no detecta cambios
      # de forma confiable. Forzar polling lo arregla.
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "1000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        echo '→ Aplicando migraciones...' &&
        alembic upgrade head &&
        echo '→ Iniciando uvicorn con reload...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 4000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    networks:
      - vitrina-net
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  vitrina-net:
    driver: bridge

volumes:
  pgdata_vitrina:
