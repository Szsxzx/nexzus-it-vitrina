# ─── Netlify — Frontend Next.js 14 (App Router, con servidor) ─────────────────
[build]
  base    = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# El runtime de Next.js de Netlify se aplica solo. No pongas redirects
# manuales a ___netlify-handler: eso es del plugin v4 y rompe el v5.
[[plugins]]
  package = "@netlify/plugin-nextjs"
